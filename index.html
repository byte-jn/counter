<!DOCTYPE html>
<html lang="de" class="h-full select-none antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Counter Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent-color: #3b82f6;
            --accent-rgb: 59, 130, 246;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .font-pixel {
            font-family: 'Press Start 2P', monospace;
        }

        .font-mono-num {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Pixel Art Styling Crisp Rendering */
        .pixel-art {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Dynamic Custom Select Box */
        .custom-select {
            appearance: none;
            -webkit-appearance: none;
            background-size: 1.25em 1.25em;
            background-position: right 0.75rem center;
            background-repeat: no-repeat;
            padding-right: 2.5rem;
        }

        .dark .custom-select {
            background-color: #121212;
            color: #f5f5f5;
            border-color: rgba(255, 255, 255, 0.1);
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23888888' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
        }

        .light .custom-select {
            background-color: #ffffff;
            color: #111111;
            border-color: rgba(0, 0, 0, 0.12);
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23555555' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
        }

        /* Spring Animation for Tap Count */
        @keyframes springPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }
        .animate-pop {
            animation: springPop 0.14s cubic-bezier(0.175, 0.885, 0.32, 1.2);
        }

        /* Hide scrollbars */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Custom Accent Glow */
        .accent-glow {
            box-shadow: 0 0 35px -5px rgba(var(--accent-rgb), 0.35);
        }
        .accent-border {
            border-color: var(--accent-color) !important;
        }
        .accent-bg {
            background-color: var(--accent-color) !important;
        }
        .accent-text {
            color: var(--accent-color) !important;
        }
    </style>
</head>
<body class="h-full w-full bg-[#080808] text-neutral-100 dark overflow-x-hidden">

    <!-- MAIN APP WRAPPER -->
    <div id="appRoot" class="min-h-full w-full flex flex-col relative">

        <!-- ==================================================== -->
        <!-- VIEW 1: OVERVIEW MAIN MENU / HUB (DEFAULT START) -->
        <!-- ==================================================== -->
        <main id="hubView" class="flex-1 w-full max-w-6xl mx-auto p-5 sm:p-8 flex flex-col gap-8">
            
            <!-- TOP BAR / HUB HEADER -->
            <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-6 border-b border-white/10 dark:border-white/10 light:border-black/10">
                <div class="flex items-center gap-3">
                    <!-- PIXEL ART STAR LOGO -->
                    <svg class="w-8 h-8 pixel-art text-amber-400 fill-current" viewBox="0 0 16 16">
                        <path d="M7 0h2v2H7zM7 2h2v2H7zM5 4h6v2H5zM1 6h14v2H1zM3 8h10v2H3zM5 10h6v2H5zM3 12h2v4H3zM11 12h2v4h-2z"/>
                    </svg>
                    <div>
                        <h1 class="text-xl font-bold tracking-wider font-pixel text-white dark:text-white light:text-black">
                            PIXEL<span class="accent-text">.COUNT</span>
                        </h1>
                        <p class="text-xs text-neutral-400 dark:text-neutral-400 light:text-neutral-600 mt-0.5">
                            Übersicht aller Zähler
                        </p>
                    </div>
                </div>

                <!-- CONTROLS & SETTINGS (DARK/LIGHT + ACCENT PALETTE) -->
                <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                    
                    <!-- DYNAMIC COLOR PALETTE PICKER -->
                    <div class="flex items-center gap-1.5 p-1.5 rounded-xl bg-neutral-900/80 dark:bg-neutral-900/80 light:bg-neutral-200/80 border border-white/10 dark:border-white/10 light:border-black/10">
                        <span class="text-[10px] font-pixel px-1 text-neutral-400 dark:text-neutral-400 light:text-neutral-600">COLOR</span>
                        <button onclick="setAccentColor('#3b82f6', '59, 130, 246')" class="w-5 h-5 rounded-md bg-blue-500 hover:scale-110 transition-transform cursor-pointer" title="Blau"></button>
                        <button onclick="setAccentColor('#10b981', '16, 185, 129')" class="w-5 h-5 rounded-md bg-emerald-500 hover:scale-110 transition-transform cursor-pointer" title="Smaragd"></button>
                        <button onclick="setAccentColor('#ec4899', '236, 72, 153')" class="w-5 h-5 rounded-md bg-pink-500 hover:scale-110 transition-transform cursor-pointer" title="Rosa"></button>
                        <button onclick="setAccentColor('#f59e0b', '245, 158, 11')" class="w-5 h-5 rounded-md bg-amber-500 hover:scale-110 transition-transform cursor-pointer" title="Amber"></button>
                        <button onclick="setAccentColor('#8b5cf6', '139, 92, 246')" class="w-5 h-5 rounded-md bg-purple-500 hover:scale-110 transition-transform cursor-pointer" title="Lila"></button>
                    </div>

                    <!-- DARK / LIGHT MODE TOGGLE -->
                    <button onclick="toggleThemeMode()" class="p-2.5 rounded-xl bg-neutral-900 dark:bg-neutral-900 light:bg-neutral-200 text-neutral-200 dark:text-neutral-200 light:text-neutral-800 border border-white/10 dark:border-white/10 light:border-black/10 hover:scale-105 transition-all cursor-pointer flex items-center justify-center" title="Dark/Light Mode Wechseln">
                        <i id="themeIcon" data-lucide="moon" class="w-4 h-4"></i>
                    </button>
                </div>
            </header>

            <!-- ACTION BANNER: NEW COUNTER -->
            <div class="flex items-center justify-between gap-4 p-4 rounded-2xl bg-neutral-900/50 dark:bg-neutral-900/50 light:bg-neutral-100 border border-white/5 dark:border-white/5 light:border-black/5">
                <div class="flex items-center gap-3">
                    <!-- PIXEL ART HEART SVG -->
                    <svg class="w-6 h-6 pixel-art text-rose-500 fill-current" viewBox="0 0 16 16">
                        <path d="M2 3h4v2H2zM10 3h4v2h-4zM0 5h8v2H0zM8 5h8v2H8zM0 7h16v2H0zM2 9h12v2H2zM4 11h8v2H4zM6 13h4v2H6z"/>
                    </svg>
                    <span class="text-xs font-semibold tracking-wider uppercase text-neutral-300 dark:text-neutral-300 light:text-neutral-700">
                        Zähler verwalten
                    </span>
                </div>

                <button onclick="openNewCounterPrompt()" class="flex items-center gap-2 px-4 py-2 rounded-xl accent-bg text-white font-semibold text-xs hover:opacity-90 transition-all cursor-pointer shadow-lg shadow-blue-500/10">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    Neuer Zähler
                </button>
            </div>

            <!-- COUNTERS GRID -->
            <div id="hubCountersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <!-- Dynamic Counter Cards Generated via JS -->
            </div>

            <!-- PIXEL DECORATION FOOTER -->
            <footer class="mt-auto pt-8 border-t border-white/5 dark:border-white/5 light:border-black/5 flex items-center justify-between text-[11px] text-neutral-500">
                <div class="flex items-center gap-2 font-pixel text-[9px]">
                    <svg class="w-4 h-4 pixel-art text-emerald-400 fill-current" viewBox="0 0 16 16">
                        <path d="M7 0h2v4H7zM3 4h10v2H3zM1 6h14v4H1zM3 10h10v2H3zM5 12h6v4H5z"/>
                    </svg>
                    <span>COOKIES ENABLED</span>
                </div>
                <span>Farbwechsel bei Klick</span>
            </footer>
        </main>


        <!-- ==================================================== -->
        <!-- VIEW 2: ULTRA-MINIMALIST FULLSCREEN COUNTER -->
        <!-- ==================================================== -->
        <main id="singleView" onclick="handleCounterTap(event)" class="hidden fixed inset-0 w-full h-full flex flex-col justify-between p-6 sm:p-10 select-none cursor-pointer bg-black dark:bg-black light:bg-white text-white dark:text-white light:text-black overflow-hidden z-40 transition-colors duration-300">
            
            <!-- TOP MINIMAL HEADER (ONLY BACK BUTTON & SELECTOR) -->
            <header onclick="event.stopPropagation()" class="w-full flex items-center justify-between z-50">
                
                <!-- BACK TO HUB BUTTON -->
                <button onclick="showHubView()" class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-neutral-900/80 dark:bg-neutral-900/80 light:bg-neutral-100 hover:bg-neutral-800 dark:hover:bg-neutral-800 light:hover:bg-neutral-200 border border-white/10 dark:border-white/10 light:border-black/10 transition-all cursor-pointer text-xs font-semibold tracking-wide">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>Zurück</span>
                </button>

                <!-- COUNTER DROPDOWN SELECTOR -->
                <select id="singleViewSelect" onchange="switchCounterFromSingle(this.value)" class="custom-select text-xs font-semibold py-2 pl-3.5 pr-8 rounded-xl border focus:outline-none cursor-pointer">
                </select>

            </header>

            <!-- ULTRA-MINIMAL CENTER COUNTER DISPLAY (ONLY NAME AND NUMBER) -->
            <div class="flex-1 flex flex-col items-center justify-center text-center my-auto pointer-events-none">
                <!-- COUNTER NAME -->
                <h2 id="singleCounterName" class="text-sm sm:text-base font-semibold tracking-[0.25em] uppercase text-neutral-400 dark:text-neutral-400 light:text-neutral-600 mb-6 font-pixel">
                    Zähler
                </h2>

                <!-- MAIN NUMBER DISPLAY -->
                <span id="singleCountDisplay" class="font-mono-num text-8xl sm:text-[12rem] font-extrabold tracking-tight text-white dark:text-white light:text-black transition-all drop-shadow-2xl">
                    0
                </span>
            </div>

            <!-- BOTTOM PIXEL ART ACCENT (PURE DECORATION) -->
            <div class="w-full flex justify-center pointer-events-none opacity-20">
                <svg class="w-6 h-6 pixel-art accent-text fill-current" viewBox="0 0 16 16">
                    <path d="M7 0h2v2H7zM7 4h2v2H7zM7 8h2v2H7zM7 12h2v2H7z"/>
                </svg>
            </div>

        </main>

    </div>

    <!-- EDIT / CONFIG MODAL (FOR HUB EDITING) -->
    <div id="editModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div onclick="event.stopPropagation()" class="bg-neutral-900 dark:bg-neutral-900 light:bg-white border border-white/10 dark:border-white/10 light:border-black/10 w-full max-w-md rounded-2xl p-6 shadow-2xl flex flex-col gap-6 text-sm text-neutral-100 dark:text-neutral-100 light:text-neutral-900">
            
            <div class="flex items-center justify-between pb-3 border-b border-white/10 dark:border-white/10 light:border-black/10">
                <h3 class="font-bold text-sm tracking-wide font-pixel">Zähler Bearbeiten</h3>
                <button onclick="closeEditModal()" class="p-1 text-neutral-400 hover:text-white dark:hover:text-white light:hover:text-black transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-neutral-400 mb-1.5">Name</label>
                    <input type="text" id="editNameInput" class="w-full bg-neutral-800 dark:bg-neutral-800 light:bg-neutral-100 border border-white/10 dark:border-white/10 light:border-black/10 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-neutral-400 mb-1.5">Wert</label>
                    <input type="number" id="editValueInput" class="w-full bg-neutral-800 dark:bg-neutral-800 light:bg-neutral-100 border border-white/10 dark:border-white/10 light:border-black/10 rounded-xl px-3.5 py-2.5 text-xs font-mono focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <div class="flex items-center gap-3 pt-2">
                <button onclick="saveEditModal()" class="flex-1 py-2.5 bg-white light:bg-black text-black light:text-white font-bold rounded-xl text-xs hover:opacity-90 transition-opacity">
                    Speichern
                </button>
                <button onclick="closeEditModal()" class="py-2.5 px-4 bg-neutral-800 dark:bg-neutral-800 light:bg-neutral-200 text-neutral-300 dark:text-neutral-300 light:text-neutral-700 font-semibold rounded-xl text-xs">
                    Abbrechen
                </button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        const COOKIE_COUNTERS = "px_counters_data";
        const COOKIE_ACTIVE_ID = "px_active_id";
        const COOKIE_THEME = "px_theme_mode";
        const COOKIE_ACCENT = "px_accent_color";
        const COOKIE_ACCENT_RGB = "px_accent_rgb";

        let counters = {};
        let activeId = "";
        let currentTheme = "dark"; // 'dark' or 'light'
        let editingCounterId = null;

        // ACCENT PALETTES FOR ON-CLICK DYNAMIC SHIFT
        const colorPalette = [
            { hex: '#3b82f6', rgb: '59, 130, 246' },   // Blue
            { hex: '#10b981', rgb: '16, 185, 129' },  // Emerald
            { hex: '#ec4899', rgb: '236, 72, 153' },  // Pink
            { hex: '#f59e0b', rgb: '245, 158, 11' },   // Amber
            { hex: '#8b5cf6', rgb: '139, 92, 246' },  // Purple
            { hex: '#ef4444', rgb: '239, 68, 68' }    // Red
        ];
        let colorIndex = 0;

        // COOKIE HELPERS
        function setCookie(name, value, days = 365) {
            const expires = new Date(Date.now() + days * 86400000).toUTCString();
            document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
        }

        function getCookie(name) {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [k, v] = cookie.trim().split('=');
                if (k === name) return decodeURIComponent(v || '');
            }
            return null;
        }

        // INITIALIZATION
        function initApp() {
            loadStateFromCookies();
            applyTheme();
            renderHubGrid();
            renderSingleSelectOptions();
            lucide.createIcons();
        }

        function loadStateFromCookies() {
            // Load Counters
            const rawCounters = getCookie(COOKIE_COUNTERS);
            if (rawCounters) {
                try { counters = JSON.parse(rawCounters); } catch (e) { counters = {}; }
            }

            if (Object.keys(counters).length === 0) {
                const defaultId = 'c_' + Date.now();
                counters[defaultId] = { id: defaultId, name: 'Main Counter', count: 0 };
            }

            const savedActiveId = getCookie(COOKIE_ACTIVE_ID);
            activeId = (savedActiveId && counters[savedActiveId]) ? savedActiveId : Object.keys(counters)[0];

            // Load Theme
            currentTheme = getCookie(COOKIE_THEME) || 'dark';

            // Load Accent Color
            const savedAccent = getCookie(COOKIE_ACCENT) || '#3b82f6';
            const savedRgb = getCookie(COOKIE_ACCENT_RGB) || '59, 130, 246';
            setAccentColor(savedAccent, savedRgb, false);
        }

        function saveAllState() {
            setCookie(COOKIE_COUNTERS, JSON.stringify(counters));
            setCookie(COOKIE_ACTIVE_ID, activeId);
            setCookie(COOKIE_THEME, currentTheme);
        }

        // ACCENT COLOR & THEME MANAGERS
        function setAccentColor(hex, rgb, save = true) {
            document.documentElement.style.setProperty('--accent-color', hex);
            document.documentElement.style.setProperty('--accent-rgb', rgb);
            if (save) {
                setCookie(COOKIE_ACCENT, hex);
                setCookie(COOKIE_ACCENT_RGB, rgb);
            }
        }

        function cycleNextAccentColor() {
            colorIndex = (colorIndex + 1) % colorPalette.length;
            const col = colorPalette[colorIndex];
            setAccentColor(col.hex, col.rgb, true);
        }

        function toggleThemeMode() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme();
            saveAllState();
        }

        function applyTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');

            if (currentTheme === 'light') {
                body.classList.remove('bg-[#080808]', 'text-neutral-100', 'dark');
                body.classList.add('bg-neutral-50', 'text-neutral-900', 'light');
                if (icon) icon.setAttribute('data-lucide', 'sun');
            } else {
                body.classList.remove('bg-neutral-50', 'text-neutral-900', 'light');
                body.classList.add('bg-[#080808]', 'text-neutral-100', 'dark');
                if (icon) icon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
        }

        // HUB OVERVIEW RENDER
        function renderHubGrid() {
            const grid = document.getElementById('hubCountersGrid');
            grid.innerHTML = '';

            Object.values(counters).forEach((c, idx) => {
                const isActive = c.id === activeId;
                const card = document.createElement('div');
                card.className = `group relative p-6 rounded-2xl border transition-all duration-200 cursor-pointer flex flex-col justify-between ${
                    isActive 
                        ? 'bg-neutral-900 dark:bg-neutral-900 light:bg-white border-blue-500/50 shadow-xl accent-glow' 
                        : 'bg-neutral-900/40 dark:bg-neutral-900/40 light:bg-white border-white/5 dark:border-white/5 light:border-black/10 hover:border-white/20'
                }`;

                card.onclick = () => openFullscreenCounter(c.id);

                // Pixel Icon choices based on index
                const pixelIcons = [
                    `<svg class="w-5 h-5 pixel-art text-amber-400 fill-current" viewBox="0 0 16 16"><path d="M7 0h2v2H7zM7 4h2v2H7zM7 8h2v2H7zM7 12h2v2H7z"/></svg>`,
                    `<svg class="w-5 h-5 pixel-art text-rose-400 fill-current" viewBox="0 0 16 16"><path d="M2 3h4v2H2zM10 3h4v2h-4zM0 5h16v2H0zM2 9h12v2H2zM6 13h4v2H6z"/></svg>`,
                    `<svg class="w-5 h-5 pixel-art text-emerald-400 fill-current" viewBox="0 0 16 16"><path d="M7 0h2v4H7zM3 4h10v2H3zM1 6h14v4H1zM5 12h6v4H5z"/></svg>`
                ];
                const selectedSvg = pixelIcons[idx % pixelIcons.length];

                card.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2.5">
                            ${selectedSvg}
                            <span class="text-xs font-bold tracking-wider uppercase text-neutral-300 dark:text-neutral-300 light:text-neutral-800 truncate max-w-[130px]">
                                ${escapeHtml(c.name)}
                            </span>
                        </div>
                        <div class="flex items-center gap-1" onclick="event.stopPropagation()">
                            <button onclick="openEditModal('${c.id}')" class="p-1 text-neutral-500 hover:text-white dark:hover:text-white light:hover:text-black transition-colors" title="Bearbeiten">
                                <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                            </button>
                            <button onclick="resetCounter('${c.id}')" class="p-1 text-neutral-500 hover:text-amber-400 transition-colors" title="Auf 0 zurücksetzen">
                                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                            </button>
                            ${Object.keys(counters).length > 1 ? `
                            <button onclick="deleteCounter('${c.id}')" class="p-1 text-neutral-500 hover:text-red-400 transition-colors" title="Löschen">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>` : ''}
                        </div>
                    </div>

                    <div class="my-6">
                        <span class="font-mono-num text-6xl font-extrabold text-white dark:text-white light:text-black tracking-tight">${c.count}</span>
                    </div>

                    <div class="flex items-center justify-between text-xs text-neutral-500 pt-3 border-t border-white/5 dark:border-white/5 light:border-black/5">
                        <span class="text-[11px] font-semibold text-neutral-400">Vollbild öffnen →</span>
                        ${isActive ? '<span class="text-[9px] font-pixel text-emerald-400">AKTIV</span>' : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        // FULLSCREEN COUNTER VIEW LOGIC
        function openFullscreenCounter(id) {
            if (counters[id]) {
                activeId = id;
                saveAllState();
            }
            renderSingleCounterView();
            document.getElementById('singleView').classList.remove('hidden');
        }

        function showHubView() {
            document.getElementById('singleView').classList.add('hidden');
            renderHubGrid();
        }

        function renderSingleCounterView() {
            const current = counters[activeId];
            if (!current) return;

            document.getElementById('singleCounterName').innerText = current.name;
            document.getElementById('singleCountDisplay').innerText = current.count;

            renderSingleSelectOptions();
        }

        function renderSingleSelectOptions() {
            const select = document.getElementById('singleViewSelect');
            select.innerHTML = '';
            Object.values(counters).forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = `${c.name} (${c.count})`;
                if (c.id === activeId) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function switchCounterFromSingle(id) {
            if (counters[id]) {
                activeId = id;
                saveAllState();
                renderSingleCounterView();
            }
        }

        function handleCounterTap(e) {
            // Increment active counter
            if (!counters[activeId]) return;
            counters[activeId].count++;

            // Cycle accent color dynamically on click
            cycleNextAccentColor();

            // Spring pop animation
            const display = document.getElementById('singleCountDisplay');
            display.classList.remove('animate-pop');
            void display.offsetWidth;
            display.classList.add('animate-pop');

            saveAllState();
            renderSingleCounterView();
        }

        // EDIT / MODAL ACTIONS
        function openEditModal(id) {
            editingCounterId = id;
            const c = counters[id];
            if (!c) return;

            document.getElementById('editNameInput').value = c.name;
            document.getElementById('editValueInput').value = c.count;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
            editingCounterId = null;
        }

        function saveEditModal() {
            if (!editingCounterId || !counters[editingCounterId]) return;

            const name = document.getElementById('editNameInput').value.trim();
            const val = parseInt(document.getElementById('editValueInput').value, 10);

            counters[editingCounterId].name = name || 'Counter';
            counters[editingCounterId].count = isNaN(val) ? 0 : val;

            saveAllState();
            closeEditModal();
            renderHubGrid();
        }

        function openNewCounterPrompt() {
            const name = prompt('Name für neuen Zähler:', 'Zähler');
            if (name !== null) {
                const newId = 'c_' + Date.now();
                counters[newId] = { id: newId, name: name.trim() || 'Zähler', count: 0 };
                activeId = newId;
                saveAllState();
                renderHubGrid();
            }
        }

        function resetCounter(id) {
            if (counters[id]) {
                counters[id].count = 0;
                saveAllState();
                renderHubGrid();
            }
        }

        function deleteCounter(id) {
            if (Object.keys(counters).length <= 1) return;
            delete counters[id];
            if (activeId === id) {
                activeId = Object.keys(counters)[0];
            }
            saveAllState();
            renderHubGrid();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // LAUNCH APP IN HUB OVERVIEW
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
