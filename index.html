<!DOCTYPE html>
<html lang="de" class="h-full bg-[#050505] text-neutral-200 select-none antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>count everything</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-pixel { font-family: 'Press Start 2P', monospace; }
        .font-mono-num { font-family: 'JetBrains Mono', monospace; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes springPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }
        .animate-spring { animation: springPop 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.2); }

        .particle {
            position: absolute;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -60px) scale(1.4); }
        }

        .color-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.15s, border-color 0.15s;
        }
        .color-dot:hover { transform: scale(1.15); }
        .color-dot.selected { border-color: #ffffff; transform: scale(1.2); }
    </style>
</head>
<body id="appBody" class="h-full w-full flex flex-col p-4 sm:p-8 md:p-12 overflow-hidden bg-[#050505] transition-colors duration-300">

    <!-- MAIN CONTAINER BOX -->
    <div id="mainBox" class="relative w-full h-full bg-[#0e0e0e] border border-white/[0.08] rounded-[2rem] shadow-2xl flex flex-col overflow-hidden transition-all duration-300">
        
        <!-- HUB HEADER BAR -->
        <header id="hubHeader" class="relative z-20 flex items-center justify-between px-6 py-4 border-b border-white/[0.06] bg-black/40 backdrop-blur-xl">
            <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('#/hub')">
                <div id="brandPixel" class="w-6 h-6 flex items-center justify-center"></div>
                <h1 class="font-pixel text-xs sm:text-sm text-white tracking-widest uppercase">count everything</h1>
            </div>

            <!-- CONTROLS RIGHT -->
            <div class="flex items-center gap-2">
                <!-- THEME SELECTOR -->
                <select id="themeSelect" onchange="changeTheme(this.value)" class="bg-white/[0.05] border border-white/[0.1] text-xs font-semibold px-3 py-1.5 rounded-xl text-neutral-300 focus:outline-none cursor-pointer">
                    <option value="classic" class="bg-[#121212]">Pixel Classic</option>
                    <option value="old" class="bg-[#121212]">Pixel Old</option>
                    <option value="dinos" class="bg-[#121212]">Dinos</option>
                    <option value="humans" class="bg-[#121212]">Humans</option>
                    <option value="cats" class="bg-[#121212]">Cats</option>
                    <option value="symbols" class="bg-[#121212]">Symbols</option>
                    <option value="dragons" class="bg-[#121212]">Dragons</option>
                    <option value="anime" class="bg-[#121212]">Anime</option>
                </select>

                <!-- DARK / LIGHT MODE -->
                <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-white/[0.05] hover:bg-white/[0.1] text-neutral-300 border border-white/[0.08] transition-all cursor-pointer" title="Dark / Light Mode">
                    <i id="themeIcon" data-lucide="moon" class="w-4 h-4"></i>
                </button>

                <!-- SETTINGS & STATS -->
                <button onclick="openSettingsModal()" class="p-2 rounded-xl bg-white/[0.05] hover:bg-white/[0.1] text-neutral-300 border border-white/[0.08] transition-all cursor-pointer" title="Einstellungen">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <!-- VIEW 1: OVERVIEW HUB (PAGE 1) -->
        <main id="hubView" class="flex-1 p-6 sm:p-10 overflow-y-auto no-scrollbar">
            <div class="max-w-5xl mx-auto">
                <div class="flex items-center justify-between mb-8 pb-4 border-b border-white/[0.06]">
                    <div>
                        <h2 class="text-lg font-bold text-white tracking-wide flex items-center gap-2">
                            <span>Alle Zähler</span>
                            <div id="pixelHeaderBadge" class="w-5 h-5 flex items-center justify-center inline-block"></div>
                        </h2>
                        <p class="text-xs text-neutral-500 mt-0.5">Klicke auf eine Karte, um den Zähler im Vollbild zu öffnen.</p>
                    </div>
                    <button id="btnNewCounter" onclick="createNewCounter()" class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-black font-semibold text-xs transition-all cursor-pointer shadow-lg">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        Neuer Zähler
                    </button>
                </div>

                <div id="countersGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                    <!-- Cards via JS -->
                </div>
            </div>
        </main>

        <!-- VIEW 2: FULLSCREEN COUNTER PAGE (PAGE 2) -->
        <main id="singleView" onclick="incrementActiveCounter(event)" class="hidden relative flex-1 flex flex-col items-center justify-center cursor-pointer group transition-colors duration-200 select-none overflow-hidden">
            
            <!-- ONLY BACK BUTTON -->
            <button onclick="event.stopPropagation(); navigateTo('#/hub')" class="absolute top-6 left-6 z-30 p-3 rounded-2xl bg-white/[0.08] hover:bg-white/[0.15] text-neutral-200 hover:text-white border border-white/[0.1] backdrop-blur-md transition-all cursor-pointer shadow-lg" title="Zurück zur Übersicht">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>

            <!-- PARTICLES CONTAINER -->
            <div id="particleContainer" class="absolute inset-0 pointer-events-none z-20"></div>

            <!-- MINIMAL CENTER DISPLAY -->
            <div id="counterCard" class="relative z-10 flex flex-col items-center justify-center text-center p-6 transition-transform">
                <!-- PIXEL ICON -->
                <div id="activeCounterPixel" class="w-16 h-16 mb-4 animate-bounce flex items-center justify-center"></div>
                
                <!-- NAME -->
                <span id="activeCounterName" class="text-base sm:text-lg font-bold tracking-widest uppercase text-neutral-300 mb-3">
                    Counter
                </span>

                <!-- NUMBER -->
                <span id="activeCountDisplay" class="font-mono-num text-8xl sm:text-[11rem] font-extrabold tracking-tight text-white drop-shadow-2xl">
                    0
                </span>

                <!-- AUTOMATION BADGE -->
                <span id="activeTriggerBadge" class="hidden mt-6 text-[11px] uppercase font-bold tracking-widest px-3.5 py-1 rounded-full bg-white/[0.08] border border-white/[0.12] text-amber-400">
                    ⚡ Auto-Trigger Aktiv
                </span>
            </div>
        </main>
    </div>

    <!-- EDIT / CUSTOMIZE COUNTER MODAL -->
    <div id="editModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div onclick="event.stopPropagation()" class="bg-[#121212] border border-white/[0.1] w-full max-w-md rounded-3xl p-6 shadow-2xl flex flex-col gap-5 text-sm max-h-[90vh] overflow-y-auto no-scrollbar">
            <div class="flex items-center justify-between pb-3 border-b border-white/[0.08]">
                <h3 class="font-bold text-white text-sm">Zähler Einstellungen</h3>
                <button onclick="closeEditModal()" class="p-1 text-neutral-400 hover:text-white">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-neutral-400 mb-1">Name des Zählers</label>
                    <input type="text" id="editNameInput" class="w-full bg-white/[0.05] border border-white/[0.1] rounded-xl px-3.5 py-2 text-white focus:outline-none text-xs">
                </div>

                <div>
                    <label class="block text-xs text-neutral-400 mb-1">Manueller Basis-Wert</label>
                    <input type="number" id="editValueInput" class="w-full bg-white/[0.05] border border-white/[0.1] rounded-xl px-3.5 py-2 text-white font-mono focus:outline-none text-xs">
                </div>

                <div>
                    <label class="block text-xs text-neutral-400 mb-1">Automatischer Trigger Typ</label>
                    <select id="editTriggerSelect" class="w-full bg-[#1a1a1a] border border-white/[0.1] rounded-xl px-3.5 py-2 text-white text-xs focus:outline-none">
                        <option value="none">Manuell (Kein Trigger)</option>
                        <option value="1s">Jede Sekunde (+1s)</option>
                        <option value="1m">Jede Minute (+1m)</option>
                        <option value="1d">Jeden Tag (+1d)</option>
                        <option value="1y">Jedes Jahr (+1y)</option>
                        <option value="load">Bei jedem Seitenaufruf (+1)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-neutral-400 mb-2">Akzentfarbe wählen</label>
                    <div id="colorPickerList" class="flex items-center gap-2.5"></div>
                </div>

                <div>
                    <label class="block text-xs text-neutral-400 mb-2">Pixel Art Icon Slot wählen</label>
                    <div id="pixelPickerList" class="flex flex-wrap gap-2 bg-white/[0.03] p-3 rounded-xl border border-white/[0.06]"></div>
                </div>
            </div>

            <div class="pt-3 border-t border-white/[0.08] flex justify-end gap-2">
                <button id="btnSaveEdit" onclick="saveEditModal()" class="px-5 py-2 text-black font-semibold rounded-xl text-xs">
                    Speichern
                </button>
            </div>
        </div>
    </div>

    <!-- SETTINGS & HIDDEN STATS MODAL -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div onclick="event.stopPropagation()" class="bg-[#121212] border border-white/[0.1] w-full max-w-lg rounded-3xl p-6 shadow-2xl flex flex-col gap-6 text-sm max-h-[90vh] overflow-y-auto no-scrollbar">
            
            <div class="flex items-center justify-between pb-3 border-b border-white/[0.08]">
                <h3 class="font-bold text-white text-base flex items-center gap-2">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                    Einstellungen & Statistiken
                </h3>
                <button onclick="closeSettingsModal()" class="p-1.5 text-neutral-400 hover:text-white rounded-lg hover:bg-white/[0.08] transition-colors">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- APP PRIMARY COLOR SELECTOR -->
            <div>
                <label class="block text-xs font-semibold text-neutral-300 mb-2">App Primärfarbe</label>
                <div id="primaryColorPicker" class="flex items-center gap-2.5"></div>
            </div>

            <!-- TOGGLES -->
            <div class="space-y-3">
                <label class="flex items-center justify-between p-3 rounded-2xl bg-white/[0.03] border border-white/[0.06] cursor-pointer">
                    <span class="text-xs font-semibold text-neutral-300">Pixel-Partikel Effekte</span>
                    <input type="checkbox" id="particleToggle" onchange="toggleParticleSetting(this.checked)" class="accent-white w-4 h-4" checked>
                </label>

                <label class="flex items-center justify-between p-3 rounded-2xl bg-white/[0.03] border border-white/[0.06] cursor-pointer">
                    <span class="text-xs font-semibold text-neutral-300">8-Bit Sound Effekte</span>
                    <input type="checkbox" id="soundToggle" onchange="toggleSoundSetting(this.checked)" class="accent-white w-4 h-4" checked>
                </label>
            </div>

            <!-- HIDDEN STATS SECTION -->
            <div class="pt-4 border-t border-white/[0.08]">
                <h4 class="text-xs font-bold uppercase tracking-wider text-neutral-400 mb-3 flex items-center gap-2">
                    <i data-lucide="bar-chart-3" class="w-3.5 h-3.5"></i>
                    Versteckte Nutzungs-Statistik
                </h4>
                <div id="statsGrid" class="grid grid-cols-2 gap-2 text-xs"></div>
            </div>

            <!-- RESET DATA -->
            <div class="pt-4 border-t border-white/[0.08]">
                <button onclick="wipeAllData()" class="w-full py-2.5 px-4 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 rounded-2xl font-semibold text-xs transition-colors flex items-center justify-center gap-2 cursor-pointer">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                    Alle Zähler & Daten löschen
                </button>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        // RAW SVG PIXEL ART MATRIX DEFINITIONS FOR ALL THEMES
        const PIXEL_MATRICES = {
            classic: [
                ["..1111..", ".111111.", "11..11..", "11111111", "..1..1..", ".1.11.1."],
                ["...11...", "..1111..", ".111111.", "11.11.11", "11111111", "..1..1.."],
                ["..1111..", ".1....1.", "1..11..1", "1..11..1", ".1....1.", "..1111.."],
                ["...11...", "..1111..", ".11..11.", "11111111", ".11..11.", "..1111.."]
            ],
            old: [
                ["..1111..", ".111111.", "11.11.11", "11111111", "11111111", "1.1..1.1"],
                ["...11...", "..1111..", ".111111.", "111..111", "11111111", "..1..1.."],
                [".111111.", "11111111", "11.11.11", "11111111", "11111111", "1.1.1.1."]
            ],
            dinos: [
                ["...1111.", "...11.11", "...11111", "1..111..", "1111111.", ".11111.."],
                ["..1111..", ".111111.", "11111111", ".111111.", "..1..1..", ".1....1."]
            ],
            humans: [
                ["..1111..", "..1111..", "...11...", ".111111.", "..1111..", "..1..1.."],
                ["...11...", "..1111..", ".111111.", "..1111..", ".1....1.", "1......1"]
            ],
            cats: [
                ["1......1", "11....11", "11111111", "11.11.11", ".111111.", "..1..1.."],
                [".1....1.", ".11..11.", ".111111.", "11.11.11", ".111111.", "...11..."]
            ],
            symbols: [
                ["...11...", "..1111..", ".111111.", "11111111", ".111111.", "..1111.."],
                ["1......1", ".1....1.", "..1..1..", "...11...", "..1..1..", ".1....1."]
            ],
            dragons: [
                ["1......1", ".11..11.", ".111111.", "11111111", ".111111.", "1..11..1"],
                ["...11...", "..1111..", "11111111", ".11..11.", "1......1", "11....11"]
            ],
            anime: [
                ["..1111..", ".111111.", "11.11.11", "11111111", ".111111.", "..1..1.."],
                [".11..11.", "11111111", "11.11.11", ".111111.", "..1111..", "...11..."]
            ]
        };

        const PALETTE = ['#ef4444', '#f97316', '#f59e0b', '#10b981', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899'];

        let counters = {};
        let activeId = "";
        let editingId = null;
        let selectedColor = PALETTE[0];
        let selectedPixelIdx = 0;

        let primaryColor = '#3b82f6';
        let currentTheme = "classic";
        let isDarkMode = true;
        let particlesEnabled = true;
        let soundEnabled = true;

        let stats = {
            totalClicks: 0,
            pageLoads: 0,
            createdCounters: 0,
            deletedCounters: 0,
            themeChanges: 0,
            autoTriggersExecuted: 0
        };

        // RENDER SVG FROM PIXEL MATRIX
        function getPixelSVG(matrix, color = "#ffffff", size = 24) {
            const rows = matrix.length;
            const cols = matrix[0].length;
            let rects = "";
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (matrix[r][c] === '1') {
                        rects += `<rect x="${c}" y="${r}" width="1" height="1" fill="${color}" />`;
                    }
                }
            }
            return `<svg viewBox="0 0 ${cols} ${rows}" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg" style="image-rendering:pixelated;">${rects}</svg>`;
        }

        function getCounterPixelSVG(pixelIdx, color = "#ffffff", size = 24) {
            const themeMatrices = PIXEL_MATRICES[currentTheme] || PIXEL_MATRICES.classic;
            const matrix = themeMatrices[pixelIdx % themeMatrices.length];
            return getPixelSVG(matrix, color, size);
        }

        // STORAGE MANAGEMENT
        function setStorage(key, value) {
            const str = JSON.stringify(value);
            const expires = new Date(Date.now() + 365 * 86400000).toUTCString();
            document.cookie = `${key}=${encodeURIComponent(str)}; expires=${expires}; path=/; SameSite=Lax`;
            try { localStorage.setItem(key, str); } catch(e) {}
        }

        function getStorage(key) {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [k, v] = cookie.trim().split('=');
                if (k === key) {
                    try { return JSON.parse(decodeURIComponent(v)); } catch(e) {}
                }
            }
            try {
                const ls = localStorage.getItem(key);
                if (ls) return JSON.parse(ls);
            } catch(e) {}
            return null;
        }

        function initApp() {
            loadData();
            stats.pageLoads = (stats.pageLoads || 0) + 1;
            
            executePageLoadTriggers();
            recalculateTimeBasedCounters();
            startIntervalTriggers();

            window.addEventListener('hashchange', handleRouting);
            handleRouting();

            applyPrimaryColor();
            lucide.createIcons();
            setupKeyboardShortcuts();
        }

        function loadData() {
            counters = getStorage('ce_counters') || {};
            activeId = getStorage('ce_active_id') || "";
            currentTheme = getStorage('ce_theme') || "classic";
            primaryColor = getStorage('ce_primary_color') || "#3b82f6";
            isDarkMode = getStorage('ce_darkmode') !== false;
            stats = getStorage('ce_stats') || stats;
            particlesEnabled = getStorage('ce_particles') !== false;
            soundEnabled = getStorage('ce_sound') !== false;

            if (Object.keys(counters).length === 0) {
                const defaultId = 'c_' + Date.now();
                counters[defaultId] = { 
                    id: defaultId, 
                    name: 'Standard Zähler', 
                    baseCount: 0, 
                    count: 0, 
                    trigger: 'none', 
                    pixelIdx: 0, 
                    color: PALETTE[5],
                    lastResetTimestamp: Date.now()
                };
                stats.createdCounters = 1;
            }

            if (!activeId || !counters[activeId]) {
                activeId = Object.keys(counters)[0];
            }

            document.getElementById('themeSelect').value = currentTheme;
            document.getElementById('particleToggle').checked = particlesEnabled;
            document.getElementById('soundToggle').checked = soundEnabled;
        }

        function saveData() {
            setStorage('ce_counters', counters);
            setStorage('ce_active_id', activeId);
            setStorage('ce_theme', currentTheme);
            setStorage('ce_primary_color', primaryColor);
            setStorage('ce_darkmode', isDarkMode);
            setStorage('ce_stats', stats);
            setStorage('ce_particles', particlesEnabled);
            setStorage('ce_sound', soundEnabled);
        }

        // TIME CALCULATIONS FOR OFFLINE BACKGROUND PROGRESSION
        function recalculateTimeBasedCounters() {
            const now = Date.now();
            let updated = false;

            Object.values(counters).forEach(c => {
                if (c.trigger && c.trigger !== 'none' && c.trigger !== 'load') {
                    const start = c.lastResetTimestamp || now;
                    const elapsed = now - start;
                    let increments = 0;

                    if (c.trigger === '1s') increments = Math.floor(elapsed / 1000);
                    else if (c.trigger === '1m') increments = Math.floor(elapsed / 60000);
                    else if (c.trigger === '1d') increments = Math.floor(elapsed / 86400000);
                    else if (c.trigger === '1y') increments = Math.floor(elapsed / 31536000000);

                    const newTotal = (c.baseCount || 0) + increments;
                    if (c.count !== newTotal) {
                        c.count = newTotal;
                        updated = true;
                    }
                }
            });

            if (updated) saveData();
        }

        function handleRouting() {
            const hash = window.location.hash || '#/hub';
            if (hash.startsWith('#/c_')) {
                const id = hash.replace('#/', '');
                if (counters[id]) {
                    activeId = id;
                    saveData();
                    showView('single');
                    return;
                }
            }
            showView('hub');
        }

        function navigateTo(hash) { window.location.hash = hash; }

        function showView(viewName) {
            const hub = document.getElementById('hubView');
            const single = document.getElementById('singleView');
            const header = document.getElementById('hubHeader');

            if (viewName === 'single') {
                hub.classList.add('hidden');
                header.classList.add('hidden');
                single.classList.remove('hidden');
            } else {
                single.classList.add('hidden');
                hub.classList.remove('hidden');
                header.classList.remove('hidden');
            }
            renderUI();
        }

        function renderUI() {
            recalculateTimeBasedCounters();
            const activeCounter = counters[activeId];
            if (!activeCounter) return;

            // Single View
            document.getElementById('activeCounterName').innerText = activeCounter.name;
            document.getElementById('activeCounterName').style.color = activeCounter.color || primaryColor;
            document.getElementById('activeCountDisplay').innerText = activeCounter.count;
            document.getElementById('activeCounterPixel').innerHTML = getCounterPixelSVG(activeCounter.pixelIdx || 0, activeCounter.color || primaryColor, 64);

            const triggerBadge = document.getElementById('activeTriggerBadge');
            if (activeCounter.trigger && activeCounter.trigger !== 'none') {
                triggerBadge.classList.remove('hidden');
                triggerBadge.innerText = `⚡ Trigger: ${activeCounter.trigger}`;
            } else {
                triggerBadge.classList.add('hidden');
            }

            document.getElementById('pixelHeaderBadge').innerHTML = getCounterPixelSVG(0, primaryColor, 20);
            document.getElementById('brandPixel').innerHTML = getCounterPixelSVG(0, primaryColor, 24);

            renderHubGrid();
            renderStats();
        }

        function renderHubGrid() {
            const grid = document.getElementById('countersGrid');
            grid.innerHTML = '';

            Object.values(counters).forEach(c => {
                const isActive = c.id === activeId;
                const card = document.createElement('div');
                card.className = `p-6 rounded-3xl border transition-all cursor-pointer flex flex-col justify-between group ${
                    isActive 
                        ? 'bg-white/[0.08] border-white/30 shadow-2xl' 
                        : 'bg-white/[0.03] border-white/[0.06] hover:border-white/20 hover:bg-white/[0.05]'
                }`;

                card.onclick = () => {
                    activeId = c.id;
                    saveData();
                    navigateTo(`#/${c.id}`);
                };

                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2.5">
                            <div class="w-7 h-7 flex items-center justify-center">${getCounterPixelSVG(c.pixelIdx || 0, c.color || primaryColor, 28)}</div>
                            <span class="text-xs font-bold uppercase tracking-wider truncate max-w-[120px]" style="color: ${c.color || primaryColor}">${escapeHtml(c.name)}</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="event.stopPropagation(); openEditModal('${c.id}')" class="p-1 text-neutral-500 hover:text-white transition-colors" title="Einstellungen">
                                <i data-lucide="settings-2" class="w-3.5 h-3.5"></i>
                            </button>
                            <button onclick="event.stopPropagation(); deleteCounter('${c.id}')" class="p-1 text-neutral-500 hover:text-red-400 transition-colors" title="Löschen">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="my-6">
                        <span class="font-mono-num text-5xl font-extrabold text-white">${c.count}</span>
                    </div>

                    <div class="flex items-center justify-between text-xs border-t border-white/[0.06] pt-3">
                        <span class="text-[10px] px-2 py-0.5 rounded-full bg-white/[0.05] text-neutral-400 font-mono">
                            ${c.trigger && c.trigger !== 'none' ? 'Trigger: ' + c.trigger : 'Manuell'}
                        </span>
                        <button onclick="event.stopPropagation(); resetCounter('${c.id}')" class="p-1 text-neutral-500 hover:text-amber-400 transition-colors" title="Zurücksetzen">
                            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function renderStats() {
            const grid = document.getElementById('statsGrid');
            if (!grid) return;
            grid.innerHTML = `
                <div class="p-2.5 rounded-xl bg-white/[0.02] border border-white/[0.05]"><span class="text-neutral-500 block">Klicks gesamt:</span> <strong class="text-white font-mono">${stats.totalClicks || 0}</strong></div>
                <div class="p-2.5 rounded-xl bg-white/[0.02] border border-white/[0.05]"><span class="text-neutral-500 block">Seitenaufrufe:</span> <strong class="text-white font-mono">${stats.pageLoads || 0}</strong></div>
                <div class="p-2.5 rounded-xl bg-white/[0.02] border border-white/[0.05]"><span class="text-neutral-500 block">Erstellte Zähler:</span> <strong class="text-white font-mono">${stats.createdCounters || 0}</strong></div>
                <div class="p-2.5 rounded-xl bg-white/[0.02] border border-white/[0.05]"><span class="text-neutral-500 block">Gelöschte Zähler:</span> <strong class="text-white font-mono">${stats.deletedCounters || 0}</strong></div>
                <div class="p-2.5 rounded-xl bg-white/[0.02] border border-white/[0.05]"><span class="text-neutral-500 block">Theme Wechsel:</span> <strong class="text-white font-mono">${stats.themeChanges || 0}</strong></div>
                <div class="p-2.5 rounded-xl bg-white/[0.02] border border-white/[0.05]"><span class="text-neutral-500 block">Auto-Triggers:</span> <strong class="text-white font-mono">${stats.autoTriggersExecuted || 0}</strong></div>
            `;
        }

        function incrementActiveCounter(e) {
            if (e) e.stopPropagation();
            counters[activeId].count++;
            counters[activeId].baseCount = (counters[activeId].baseCount || 0) + 1;
            stats.totalClicks = (stats.totalClicks || 0) + 1;
            saveData();

            playBleepSound();
            if (particlesEnabled && e) spawnParticle(e.clientX, e.clientY);

            const card = document.getElementById('counterCard');
            card.classList.remove('animate-spring');
            void card.offsetWidth;
            card.classList.add('animate-spring');

            renderUI();
        }

        function createNewCounter() {
            const name = prompt('Name für neuen Zähler:', 'Neuer Zähler');
            if (!name || !name.trim()) return;

            const newId = 'c_' + Date.now();
            const randomColor = PALETTE[Math.floor(Math.random() * PALETTE.length)];

            counters[newId] = { 
                id: newId, 
                name: name.trim(), 
                baseCount: 0, 
                count: 0, 
                trigger: 'none', 
                pixelIdx: 0, 
                color: randomColor,
                lastResetTimestamp: Date.now()
            };
            activeId = newId;
            stats.createdCounters = (stats.createdCounters || 0) + 1;
            saveData();
            renderUI();
        }

        function openEditModal(id) {
            editingId = id;
            const c = counters[id];
            if (!c) return;

            document.getElementById('editNameInput').value = c.name;
            document.getElementById('editValueInput').value = c.count;
            document.getElementById('editTriggerSelect').value = c.trigger || 'none';
            selectedColor = c.color || primaryColor;
            selectedPixelIdx = c.pixelIdx || 0;

            // Render Color Picker
            const colorContainer = document.getElementById('colorPickerList');
            colorContainer.innerHTML = '';
            PALETTE.forEach(col => {
                const dot = document.createElement('div');
                dot.className = `color-dot ${col === selectedColor ? 'selected' : ''}`;
                dot.style.backgroundColor = col;
                dot.onclick = () => {
                    selectedColor = col;
                    document.querySelectorAll('#colorPickerList .color-dot').forEach(d => d.classList.remove('selected'));
                    dot.classList.add('selected');
                };
                colorContainer.appendChild(dot);
            });

            // Render Pixel Pickers
            const pixelContainer = document.getElementById('pixelPickerList');
            pixelContainer.innerHTML = '';
            const themeMatrices = PIXEL_MATRICES[currentTheme] || PIXEL_MATRICES.classic;
            themeMatrices.forEach((_, idx) => {
                const btn = document.createElement('button');
                btn.className = `p-2 rounded-xl flex items-center justify-center ${idx === selectedPixelIdx ? 'bg-white/20 border border-white/40' : 'hover:bg-white/10'}`;
                btn.innerHTML = getCounterPixelSVG(idx, selectedColor, 28);
                btn.onclick = () => {
                    selectedPixelIdx = idx;
                    document.querySelectorAll('#pixelPickerList button').forEach(b => b.className = 'p-2 rounded-xl flex items-center justify-center hover:bg-white/10');
                    btn.className = 'p-2 rounded-xl flex items-center justify-center bg-white/20 border border-white/40';
                };
                pixelContainer.appendChild(btn);
            });

            document.getElementById('editModal').classList.remove('hidden');
        }

        function saveEditModal() {
            if (!editingId || !counters[editingId]) return;
            const newName = document.getElementById('editNameInput').value.trim();
            const newVal = parseInt(document.getElementById('editValueInput').value, 10);
            const newTrigger = document.getElementById('editTriggerSelect').value;

            if (newName) counters[editingId].name = newName;
            
            const targetVal = isNaN(newVal) ? 0 : newVal;
            counters[editingId].count = targetVal;
            counters[editingId].baseCount = targetVal;
            counters[editingId].trigger = newTrigger;
            counters[editingId].color = selectedColor;
            counters[editingId].pixelIdx = selectedPixelIdx;
            counters[editingId].lastResetTimestamp = Date.now();

            saveData();
            closeEditModal();
            renderUI();
        }

        function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }

        function deleteCounter(id) {
            if (Object.keys(counters).length <= 1) {
                alert('Es muss mindestens ein Zähler existieren.');
                return;
            }
            delete counters[id];
            stats.deletedCounters = (stats.deletedCounters || 0) + 1;
            if (activeId === id) activeId = Object.keys(counters)[0];
            saveData();
            renderUI();
        }

        function resetCounter(id) {
            if (counters[id]) {
                counters[id].count = 0;
                counters[id].baseCount = 0;
                counters[id].lastResetTimestamp = Date.now();
                saveData();
                renderUI();
            }
        }

        function changeTheme(themeKey) {
            if (PIXEL_MATRICES[themeKey]) {
                currentTheme = themeKey;
                stats.themeChanges = (stats.themeChanges || 0) + 1;
                saveData();
                renderUI();
            }
        }

        function applyPrimaryColor() {
            document.getElementById('btnNewCounter').style.backgroundColor = primaryColor;
            document.getElementById('btnSaveEdit').style.backgroundColor = primaryColor;
            
            // Primary Color Picker in Settings
            const container = document.getElementById('primaryColorPicker');
            if (container) {
                container.innerHTML = '';
                PALETTE.forEach(col => {
                    const dot = document.createElement('div');
                    dot.className = `color-dot ${col === primaryColor ? 'selected' : ''}`;
                    dot.style.backgroundColor = col;
                    dot.onclick = () => {
                        primaryColor = col;
                        saveData();
                        applyPrimaryColor();
                        renderUI();
                    };
                    container.appendChild(dot);
                });
            }
        }

        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            const body = document.getElementById('appBody');
            const box = document.getElementById('mainBox');
            const icon = document.getElementById('themeIcon');

            if (isDarkMode) {
                body.className = body.className.replace('bg-neutral-200', 'bg-[#050505]');
                box.className = box.className.replace('bg-white text-black', 'bg-[#0e0e0e] text-neutral-200');
                icon.setAttribute('data-lucide', 'moon');
            } else {
                body.className = body.className.replace('bg-[#050505]', 'bg-neutral-200');
                box.className = box.className.replace('bg-[#0e0e0e] text-neutral-200', 'bg-white text-black');
                icon.setAttribute('data-lucide', 'sun');
            }
            saveData();
            lucide.createIcons();
        }

        function executePageLoadTriggers() {
            Object.values(counters).forEach(c => {
                if (c.trigger === 'load') {
                    c.count++;
                    c.baseCount = (c.baseCount || 0) + 1;
                    stats.autoTriggersExecuted = (stats.autoTriggersExecuted || 0) + 1;
                }
            });
            saveData();
        }

        function startIntervalTriggers() {
            setInterval(() => {
                recalculateTimeBasedCounters();
                if (!document.getElementById('singleView').classList.contains('hidden') || !document.getElementById('hubView').classList.contains('hidden')) {
                    renderUI();
                }
            }, 1000);
        }

        function spawnParticle(x, y) {
            const container = document.getElementById('particleContainer');
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerHTML = getCounterPixelSVG(counters[activeId].pixelIdx || 0, counters[activeId].color || primaryColor, 32);
            p.style.left = `${x}px`;
            p.style.top = `${y}px`;
            container.appendChild(p);
            setTimeout(() => p.remove(), 600);
        }

        function playBleepSound() {
            if (!soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(440 + Math.random() * 200, ctx.currentTime);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch(e) {}
        }

        function openSettingsModal() { 
            applyPrimaryColor();
            document.getElementById('settingsModal').classList.remove('hidden'); 
        }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }
        function toggleParticleSetting(val) { particlesEnabled = val; saveData(); }
        function toggleSoundSetting(val) { soundEnabled = val; saveData(); }

        function wipeAllData() {
            if (confirm('Wirklich ALLE Zähler und Statistiken löschen?')) {
                counters = {};
                stats = { totalClicks: 0, pageLoads: 0, createdCounters: 0, deletedCounters: 0, themeChanges: 0, autoTriggersExecuted: 0 };
                initApp();
                closeSettingsModal();
            }
        }

        function setupKeyboardShortcuts() {
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'Enter') {
                    if (document.getElementById('singleView').classList.contains('hidden')) return;
                    e.preventDefault();
                    if (!e.repeat) incrementActiveCounter();
                } else if (e.key === 'Escape') {
                    closeSettingsModal();
                    closeEditModal();
                    navigateTo('#/hub');
                }
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        initApp();
    </script>
</body>
</html>
